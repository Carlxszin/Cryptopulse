<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - RecargaFast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800">

    <!-- Loading Screen (Antes de verificar Auth) -->
    <div id="auth-loading" class="fixed inset-0 z-50 bg-slate-50 flex flex-col items-center justify-center">
        <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
        <p class="text-slate-500 font-medium">Verificando permissões...</p>
    </div>

    <!-- Error/Denied Screen -->
    <div id="auth-denied" class="hidden fixed inset-0 z-50 bg-slate-50 flex flex-col items-center justify-center">
        <i data-lucide="shield-alert" class="w-16 h-16 text-red-500 mb-4"></i>
        <h2 class="text-2xl font-bold text-slate-800 mb-2">Acesso Negado</h2>
        <p class="text-slate-500 mb-6">Você não tem permissão de administrador para ver esta página.</p>
        <a href="/" class="bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-indigo-700 transition-colors">Voltar ao site</a>
    </div>

    <!-- Admin Content -->
    <div id="admin-content" class="hidden">
        <nav class="bg-slate-800 shadow-sm text-white">
            <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    <span class="text-xl font-bold tracking-wide">RecargaFast Admin</span>
                </div>
                <a href="/" class="flex items-center gap-2 text-slate-300 hover:text-white text-sm font-medium transition-colors">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar ao site
                </a>
            </div>
        </nav>

        <main class="max-w-4xl mx-auto px-4 py-8">
            <div class="grid md:grid-cols-2 gap-8">
                <!-- Operadoras -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="text-xl font-bold mb-4 text-slate-800 flex items-center gap-2">
                        <i data-lucide="radio" class="w-5 h-5 text-indigo-500"></i> Operadoras
                    </h3>
                    <div id="admin-operators-list" class="space-y-3 mb-6 max-h-64 overflow-y-auto pr-2"></div>
                    <hr class="my-4 border-slate-100">
                    <h4 class="font-semibold text-sm text-slate-600 mb-3">Adicionar Nova</h4>
                    <form id="form-add-operator" class="space-y-3">
                        <input type="text" id="op-name" placeholder="Nome (ex: Correios)" class="w-full px-4 py-3 border border-slate-200 bg-slate-50 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                        <select id="op-color" class="w-full px-4 py-3 border border-slate-200 bg-slate-50 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                            <option value="bg-purple-600">Roxo</option>
                            <option value="bg-red-600">Vermelho</option>
                            <option value="bg-blue-600">Azul</option>
                            <option value="bg-yellow-500">Amarelo</option>
                            <option value="bg-emerald-500">Verde</option>
                            <option value="bg-slate-800">Preto</option>
                            <option value="bg-pink-500">Rosa</option>
                        </select>
                        <button type="submit" class="w-full bg-slate-800 text-white py-3 rounded-xl text-sm font-bold hover:bg-slate-900 transition-colors">Salvar Operadora</button>
                    </form>
                </div>

                <!-- Pacotes -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="text-xl font-bold mb-4 text-slate-800 flex items-center gap-2">
                        <i data-lucide="package" class="w-5 h-5 text-emerald-500"></i> Pacotes
                    </h3>
                    <div id="admin-packages-list" class="space-y-3 mb-6 max-h-64 overflow-y-auto pr-2"></div>
                    <hr class="my-4 border-slate-100">
                    <h4 class="font-semibold text-sm text-slate-600 mb-3">Adicionar Novo</h4>
                    <form id="form-add-package" class="space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="number" id="pkg-value" placeholder="Valor Real (R$)" step="0.01" class="w-full px-4 py-3 border border-slate-200 bg-slate-50 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                            <input type="number" id="pkg-pay" placeholder="Valor Cobrado (R$)" step="0.01" class="w-full px-4 py-3 border border-slate-200 bg-slate-50 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="pkg-discount" placeholder="Tag (ex: 20% OFF)" class="w-full px-4 py-3 border border-slate-200 bg-slate-50 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                            <label class="flex items-center justify-center gap-2 text-sm font-medium text-slate-600 border border-slate-200 bg-slate-50 px-3 py-3 rounded-xl cursor-pointer hover:bg-slate-100 transition-colors">
                                <input type="checkbox" id="pkg-popular" class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500">
                                Destaque
                            </label>
                        </div>
                        <button type="submit" class="w-full bg-slate-800 text-white py-3 rounded-xl text-sm font-bold hover:bg-slate-900 transition-colors">Salvar Pacote</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBA_qqcT9NC9wCMFDPR34WMt6NYIMGB35w",
            authDomain: "recarga-eff36.firebaseapp.com",
            projectId: "recarga-eff36",
            storageBucket: "recarga-eff36.firebasestorage.app",
            messagingSenderId: "209300037391",
            appId: "1:209300037391:web:8420372be4d3ba6e28687a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const DOM = {
            loading: document.getElementById('auth-loading'),
            denied: document.getElementById('auth-denied'),
            content: document.getElementById('admin-content'),
            opList: document.getElementById('admin-operators-list'),
            pkgList: document.getElementById('admin-packages-list'),
            formOp: document.getElementById('form-add-operator'),
            formPkg: document.getElementById('form-add-package')
        };

        lucide.createIcons();

        // Checagem de Autenticação e Permissão de Admin
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userSnap = await getDoc(doc(db, 'users', user.uid));
                if (userSnap.exists() && userSnap.data().isAdmin === true) {
                    DOM.loading.classList.add('hidden');
                    DOM.content.classList.remove('hidden');
                    loadAdminData(); // Se é admin, carrega os dados
                } else {
                    DOM.loading.classList.add('hidden');
                    DOM.denied.classList.remove('hidden');
                }
            } else {
                DOM.loading.classList.add('hidden');
                DOM.denied.classList.remove('hidden');
            }
        });

        async function loadAdminData() {
            // Operadoras
            const opsSnap = await getDocs(collection(db, 'operators'));
            const operators = opsSnap.docs.map(d => ({id: d.id, ...d.data()}));
            
            DOM.opList.innerHTML = operators.map(op => `
                <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-100 rounded-xl">
                    <div class="flex items-center gap-3">
                        <div class="w-4 h-4 rounded-full ${op.color}"></div>
                        <span class="font-bold text-slate-700 text-sm">${op.name}</span>
                    </div>
                    <button onclick="deleteItem('operators', '${op.id}')" class="text-red-500 hover:text-red-700 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
            `).join('');

            // Pacotes
            const pkgsSnap = await getDocs(collection(db, 'packages'));
            const amounts = pkgsSnap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => Number(a.value) - Number(b.value));

            DOM.pkgList.innerHTML = amounts.map(pkg => `
                <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-100 rounded-xl">
                    <div class="flex flex-col">
                        <span class="font-bold text-slate-800 text-sm">R$ ${Number(pkg.value).toFixed(2)} por R$ ${Number(pkg.pay).toFixed(2)}</span>
                        <span class="text-xs text-emerald-600 font-semibold">${pkg.discount} ${pkg.popular ? '⭐' : ''}</span>
                    </div>
                    <button onclick="deleteItem('packages', '${pkg.id}')" class="text-red-500 hover:text-red-700 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
            `).join('');
            
            lucide.createIcons();
        }

        window.deleteItem = async (collectionName, id) => {
            if(confirm('Tem certeza que deseja remover?')) {
                await deleteDoc(doc(db, collectionName, id));
                loadAdminData();
            }
        };

        DOM.formOp.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('op-name').value;
            const color = document.getElementById('op-color').value;
            const id = name.toLowerCase().replace(/\s+/g, '');
            await setDoc(doc(db, 'operators', id), { id, name, color });
            DOM.formOp.reset();
            loadAdminData();
        });

        DOM.formPkg.addEventListener('submit', async (e) => {
            e.preventDefault();
            const value = parseFloat(document.getElementById('pkg-value').value);
            const pay = parseFloat(document.getElementById('pkg-pay').value);
            const discount = document.getElementById('pkg-discount').value;
            const popular = document.getElementById('pkg-popular').checked;
            const id = Date.now().toString(); 
            await setDoc(doc(db, 'packages', id), { id, value, pay, discount, popular });
            DOM.formPkg.reset();
            loadAdminData();
        });
    </script>
</body>
</html>
